name: Build ESP32-S3

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: espressif/idf:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build firmware
        run: |
          bash -c "source $IDF_PATH/export.sh && cd examples/hello_world && idf.py set-target esp32s3 && idf.py build"

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: examples/hello_world/build/*.bin
