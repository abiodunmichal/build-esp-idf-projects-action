name: Build ESP32-S3 Firmware

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: espressif/idf:latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up ESP-IDF environment
        run: |
          . $IDF_PATH/export.sh

      - name: Build ESP32-S3 Example
        run: |
          # Build directory
          BUILD_DIR=examples/hello_world/build
          
          # Set target and build from repo root
          idf.py set-target esp32s3 -B $BUILD_DIR examples/hello_world
          idf.py build -B $BUILD_DIR examples/hello_world

      - name: Upload Firmware Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: esp32s3_firmware
          path: examples/hello_world/build/*.bin
