name: Build ESP32-S3 Firmware Examples

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: espressif/idf:latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build all ESP32-S3 examples
        run: |
          . $IDF_PATH/export.sh  # Activate ESP-IDF

          for EXAMPLE in examples/*; do
            if [ -d "$EXAMPLE" ]; then
              echo "Building $EXAMPLE ..."
              cd $EXAMPLE

              # Create build folder if missing
              mkdir -p build

              # Set target and build
              idf.py set-target esp32s3 -B build
              idf.py fullclean
              idf.py build -B build

              cd - > /dev/null
            fi
          done
        shell: bash

      - name: Collect firmware artifacts
        run: |
          mkdir -p artifacts
          for EXAMPLE in examples/*; do
            cp $EXAMPLE/build/*.bin artifacts/ || true
          done
        shell: bash

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: esp32s3_firmware_examples
          path: artifacts/*.bin
