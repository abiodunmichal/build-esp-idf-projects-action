name: Build ESP32-S3 Firmware

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: espressif/idf:latest

    steps:
      # 1️⃣ Checkout your repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2️⃣ Install ESP-IDF (comes pre-installed in container)
      # You can skip this because espressif/idf:latest already has it

      # 3️⃣ Set target and build
      - name: Build ESP32-S3 Hello World
        run: |
          cd examples/hello_world
          idf.py set-target esp32s3      # ensures build target is ESP32-S3
          idf.py fullclean               # clean any previous build
          idf.py build                   # build the project

      # 4️⃣ Upload all firmware artifacts
      - name: Upload Firmware Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: esp32s3_firmware
          path: |
            examples/hello_world/build/bootloader/bootloader.bin
            examples/hello_world/build/partition_table/partition-table.bin
            examples/hello_world/build/hello_world.bin
            examples/hello_world/build/flasher_args.json
            examples/hello_world/build/sdkconfig.json
